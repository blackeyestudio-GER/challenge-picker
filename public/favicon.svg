<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Card background with rounded corners -->
  <rect x="10" y="14" width="44" height="36" rx="5" ry="5" fill="url(#brandGradient)"/>
  
  <!-- Card shadow/depth -->
  <rect x="10" y="14" width="44" height="36" rx="5" ry="5" fill="rgba(0,0,0,0.2)"/>
  <rect x="10" y="14" width="44" height="36" rx="5" ry="5" fill="url(#brandGradient)"/>
  
  <!-- Card inner highlight -->
  <rect x="13" y="17" width="38" height="30" rx="3" ry="3" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Picker/Arrow symbol pointing to card -->
  <path d="M 20 32 L 28 24 M 20 32 L 28 40" stroke="rgba(255,255,255,0.95)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2.5"/>
</svg>
