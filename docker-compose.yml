services:
  # PHP-FPM for Symfony
  # Config via Compose/Portainer env (${VAR}) — no required backend/.env in git.
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
      # Persist JWT keys across Portainer git redeploys (.pem is gitignored)
      - jwt_keys:/var/www/html/config/jwt
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changeme_in_production_must_be_32_chars_long}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: ${DATABASE_URL:-mysql://user:password@mysql:3306/challenge_picker_db?serverVersion=8.0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-changeme_jwt_passphrase}
      JWT_TTL: ${JWT_TTL:-3600}
      # Secrets: set in root .env (local) or Portainer Stack env — never commit real values
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-your_discord_client_id_here}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-your_discord_client_secret_here}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8090/api/user/connect/discord/callback}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-your_twitch_client_id_here}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-your_twitch_client_secret_here}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-http://localhost:8090/api/user/connect/twitch/callback}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127.0.0.1)(:[0-9]+)?$$}
      STEAM_API_KEY: ${STEAM_API_KEY:-your_steam_api_key_here}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8090}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8090}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - mysql

  # Nginx to serve Symfony
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-challenge_picker_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - mysql

  # Nuxt.js Frontend (Node 20 LTS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_HOST: ${API_HOST:-http://nginx:80}
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
  jwt_keys:
